name: Release

# Auto-release flow, mirroring the Hesabyar release workflow.
#
# A merge to main that changes application code runs the PREPARE job: it
# computes the next version from conventional commits, runs tests, builds
# the launcher packages, pushes a release/vX.Y.Z branch and opens a
# Mergify-queued Pull Request back to main. This workflow NEVER pushes to main
# directly.
#
# When the release PR merges, the landing push on main runs the FINALIZE
# job: the tag and GitHub Release are published from the artifacts
# produced by the prepare run. The prepare run ID travels to finalize
# inside the release PR body, so finalize downloads exactly the
# artifacts built for this release.
#
# Only merges to main can prepare a release: a direct push to main (one
# with no merged pull request behind it) is classified as manual-skip,
# as is any push whose head commit message contains [skip release].
#
# Manual releases still work: pushing a v* tag or dispatching the workflow
# runs the RELEASE job (a draft release for dispatch, a full release for
# a tag push), exactly as before.
#
# Required repository settings: "Allow GitHub Actions to create and
# approve pull requests" (Settings > Actions > General) so prepare can
# open the release PR, and Mergify installed with queueing enabled for
# the repo. The release PR is merged by Mergify (app token), NOT by
# github-actions[bot] auto-merge: pushes by github-actions[bot] do NOT
# trigger a new workflow run, so a bot-merged release PR would never
# run FINALIZE (seen on v0.2.1: PR #46 auto-merged, no finalize run,
# release completed manually).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for a draft test release (e.g. v0.0.0-test)'
        required: true
        default: 'v0.0.0-test'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  classify:
    # Decide what this push to main means. No checkout needed; this job
    # talks to the GitHub API only. Skipped entirely for tag/dispatch runs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      version: ${{ steps.classify.outputs.version }}
      pr_number: ${{ steps.classify.outputs.pr_number }}
    steps:
      - name: Classify push
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.username }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mode="prepare"
          version=""
          pr_number=""

          # Exact lookup: the pull request(s) associated with this landing
          # commit. Works for merge commits, squash and rebase strategies,
          # and cannot miss due to a page-size limit.
          # An API failure must NOT fall through to the prepare path: a real
          # release landing would then never be finalized. Abort loudly so
          # the run can be retried.
          if ! prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '.[] | select(.head.ref | test("^release/v[0-9]+\\.[0-9]+\\.[0-9]+$")) | [(.number | tostring), .head.ref] | @tsv' \
            2>api_err.log); then
            echo "::error::Failed to query PRs associated with commit ${HEAD_SHA}: $(cat api_err.log)"
            echo "::error::Cannot classify this push safely. Re-run the Release workflow once GitHub API access works."
            exit 1
          fi

          if [ -n "$prs" ]; then
            mode="finalize"
            pr_number=$(printf '%s' "$prs" | head -n1 | cut -f1)
            branch=$(printf '%s' "$prs" | head -n1 | cut -f2)
            version="${branch#release/v}"
          elif [ "$HEAD_AUTHOR" = "github-actions[bot]" ] && \
               printf '%s' "$HEAD_MESSAGE" | head -n1 | grep -qE '^chore: release v[0-9]+\.[0-9]+\.[0-9]+'; then
            # Fallback: a bot-authored release commit landed without PR
            # metadata (for example a squash whose PR was deleted).
            mode="finalize"
            version=$(printf '%s' "$HEAD_MESSAGE" | head -n1 | sed -E 's/^chore: release v([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          elif printf '%s' "$HEAD_MESSAGE" | grep -q '\[skip release\]'; then
            mode="manual-skip"
            {
              echo "### ⏭️ Release skipped"
              echo ""
              echo "Head commit message contains [skip release]."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # Only merges to main can prepare a release. A direct push has
            # no merged pull request behind it, so it never starts the
            # release flow. This works for merge commits, squash merges
            # and rebase merges alike: a parent count cannot tell them
            # apart, since squash and rebase landings have one parent.
            if ! merged=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length' \
              2>api_err2.log); then
              echo "::error::Failed to query PRs associated with commit ${HEAD_SHA}: $(cat api_err2.log)"
              echo "::error::Cannot classify this push safely. Re-run the Release workflow once GitHub API access works."
              exit 1
            fi
            if [ "$merged" -eq 0 ]; then
              mode="manual-skip"
              {
                echo "### ⏭️ Release skipped"
                echo ""
                echo "Head commit is not associated with a merged pull request to main; only merges to main prepare a release."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo "mode=$mode"
            echo "version=$version"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"
          echo "Push classified as: $mode${version:+ (v$version)}"

  finalize:
    # Publish tag + GitHub Release after the release PR reached main.
    needs: classify
    if: needs.classify.outputs.mode == 'finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Publish the tag and GitHub Release.
      contents: write
      # Read the prepare run's artifacts.
      actions: read
      # Read the release PR body to extract the prepare run ID.
      pull-requests: read
    env:
      VERSION: ${{ needs.classify.outputs.version }}
      PR_NUMBER: ${{ needs.classify.outputs.pr_number }}
      HEAD_SHA: ${{ github.sha }}
      # The finalize job intentionally does NOT check out the repo (it is a
      # pure API job). `gh pr view` / `gh release view` therefore cannot infer
      # the repository from git context and fail with
      # "fatal: not a git repository". Pin the repo explicitly so those
      # calls resolve without a checkout.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check existing GitHub Release
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "already_done=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release v$VERSION already exists - nothing to do."
          else
            echo "already_done=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Release v$VERSION missing - publishing now."
          fi

      - name: Download prepared artifacts
        if: steps.state.outputs.already_done == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts notes

          # Prefer the artifacts produced by the exact prepare run recorded
          # in the release PR body. A failed API read on an existing PR
          # aborts loudly; no PR at all or a missing marker falls back to a
          # name-only lookup with visible warnings.
          if [ -n "$PR_NUMBER" ]; then
            if ! pr_body=$(gh pr view "$PR_NUMBER" --json body --jq '.body'); then
              echo "::error::Failed to read body of PR #${PR_NUMBER}; cannot resolve the prepare run for v${VERSION}."
              exit 1
            fi
            run_id=$(printf '%s' "$pr_body" | grep -o 'shiftyar-release-run:[0-9]*' | head -n1 | cut -d: -f2 || true)
          else
            echo "::warning::Finalizing without a release PR; using latest artifact named 'release-v${VERSION}'."
            run_id=""
          fi
          if [ -z "$run_id" ]; then
            echo "::warning::No prepare-run marker for v${VERSION}; using latest matching artifact. Verify the published packages belong to this release."
          fi

          fetch_artifact () {
            local name="$1" dest="$2" list_url id
            if [ -n "$run_id" ]; then
              list_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=${name}&per_page=100"
            else
              echo "::warning::No prepare run marker on PR #${PR_NUMBER}; using latest artifact named ${name}."
              list_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100"
            fi
            id=$(curl -sfL --proto '=https' -H "Authorization: Bearer $GH_TOKEN" "$list_url" | \
              jq -r '[.artifacts[] | select(.expired == false)][0].id // empty')
            if [ -z "$id" ]; then
              echo "::error::CI artifact '${name}' not found (or expired). Cannot publish v${VERSION} without its build artifacts."
              exit 1
            fi
            curl -sfL --proto '=https' -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o artifact.zip
            unzip -q artifact.zip -d "$dest"
            rm -f artifact.zip
          }

          fetch_artifact "release-v${VERSION}" release-artifacts
          fetch_artifact "release-notes-v${VERSION}" notes
          ls -la release-artifacts notes

      - name: Publish tag and GitHub Release
        if: steps.state.outputs.already_done == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --target pins the tag exactly to the commit merged into main;
          # gh creates the tag as part of the release publication.
          gh release create "v${VERSION}" \
            --target "$HEAD_SHA" \
            --title "v${VERSION}" \
            --notes-file notes/release-notes.md \
            release-artifacts/shiftyar-app.zip \
            release-artifacts/shiftyar-launcher.zip
          echo "Published v${VERSION} at commit ${HEAD_SHA}."

      - name: Summary - finalized
        if: steps.state.outputs.already_done == 'false'
        run: |
          {
            echo "### 🚀 Release v${VERSION} published"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Version | ${VERSION} |"
            echo "| Source PR | #${PR_NUMBER:-unknown} |"
            echo "| Tag | v${VERSION} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary - already published
        if: steps.state.outputs.already_done == 'true'
        run: |
          {
            echo "### ⏭️ Finalize skipped"
            echo ""
            echo "Release v${VERSION} already exists."
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    # Normal application change landed on main: build a candidate release
    # and hand it over as a Mergify-queued PR.
    needs: classify
    if: needs.classify.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Push the release branch.
      contents: write
      # Create the release PR, stamp its body, queue it with Mergify.
      pull-requests: write
      # Upload the prepared artifacts.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Detect application changes
        id: detect
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          if bash scripts/detect-changes.sh "$BASE_REF" HEAD; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse conventional commits
        if: steps.detect.outputs.release_needed == 'true'
        id: parse
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          result=$(bash scripts/parse-commits.sh "$BASE_REF" HEAD)
          bump_type=$(echo "$result" | jq -r '.bump_type')
          summary=$(echo "$result" | jq -r '.summary')
          {
            echo "bump_type=$bump_type"
            echo "summary<<EOF"
            echo "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump_type"

      - name: Bump version
        if: steps.detect.outputs.release_needed == 'true'
        id: bump
        env:
          BUMP_TYPE: ${{ steps.parse.outputs.bump_type }}
        run: |
          new_version=$(bash scripts/bump-version.sh "$BUMP_TYPE")
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        if: steps.detect.outputs.release_needed == 'true'
        id: check_tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          # Remote check is authoritative even when the local clone lacks refs.
          # A manual tag can advance past package.json, so an auto-computed
          # version is releasable only when it is strictly newer than every
          # existing v* tag. Otherwise the run would publish an older version
          # after a newer manual one. Treat that exactly like an existing
          # tag: every downstream step already gates on tag_exists.
          highest_tag=$(git ls-remote --tags origin 'refs/tags/v*' | grep -v '\^{}$' | sed -E 's|.*refs/tags/v||' | sort -V | tail -n1)
          if [ -n "$(git ls-remote origin "refs/tags/v${NEW_VERSION}")" ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$highest_tag" ] && [ "$(printf '%s\n%s\n' "$highest_tag" "$NEW_VERSION" | sort -V | tail -n1)" != "$NEW_VERSION" ]; then
            echo "Version v${NEW_VERSION} is not newer than latest tag v${highest_tag}; skipping release."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Run tests
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: npm test

      - name: Build packages
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          mkdir -p pkg/app
          cp -r server web package.json pkg/app/
          echo "$NEW_VERSION" > pkg/app/version.txt
          cd pkg
          zip -r ../shiftyar-app.zip app
          cd ..
          zip -j shiftyar-launcher.zip launcher/shiftyar-launcher.cmd launcher/update.ps1 launcher/README.md

      - name: Write release notes
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        id: notes
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          SUMMARY: ${{ steps.parse.outputs.summary }}
        run: |
          {
            echo "## Changes included"
            echo ""
            printf '%s\n' "$SUMMARY"
          } > release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-v${{ steps.bump.outputs.new_version }}
          path: |
            shiftyar-app.zip
            shiftyar-launcher.zip
          retention-days: 30

      - name: Upload release notes artifact
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-v${{ steps.bump.outputs.new_version }}
          path: release-notes.md
          retention-days: 30

      - name: Publish release branch and pull request
        id: publish
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          BUMP_TYPE: ${{ steps.parse.outputs.bump_type }}
          SUMMARY: ${{ steps.parse.outputs.summary }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="release/v${NEW_VERSION}"

          # Marker stamped into the PR body so finalize can find exactly these
          # artifacts. Written into the body AT CREATION TIME (not via a later
          # edit) so it survives even if the separate stamping step is skipped
          # or fails. The dedicated 'Stamp release run into PR body' step below
          # re-stamps a *reused* PR; it is decoupled (continue-on-error) so a
          # transient API failure there can never block the Mergify queue step.
          marker="<!-- shiftyar-release-run:${RUN_ID} -->"

          # Commit the release state on the dedicated branch. The branch tip
          # is the exact main commit that triggered this run, plus the
          # version-bump commit below.
          git checkout -B "$BRANCH"
          git add package.json
          git commit -m "chore: release v${NEW_VERSION} [skip release]"

          existing_pr=$(gh pr list --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')

          remote_branch_exists=$(git ls-remote --heads origin "$BRANCH" | wc -l)

          if [ "$remote_branch_exists" -gt 0 ]; then
            # Automation-owned branch. An attached open PR gets refreshed with
            # the freshly computed release state; a stale branch with no PR is
            # replaced the same way.
            # Refresh the remote-tracking ref before pushing: the lease must
            # be based on the branch's CURRENT remote tip. Relying on the
            # initial checkout's refs is fragile, and without the ref at all
            # --force-with-lease refuses every push.
            git fetch origin "$BRANCH"
            git push --force-with-lease origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi

          if [ -n "$existing_pr" ]; then
            echo "Reusing existing PR #${existing_pr} for $BRANCH."
            pr_number="$existing_pr"
          else
            # PR body assembly. The SUMMARY comes from commit subjects on
            # main and is never shell-expanded: it goes through printf,
            # outside any unquoted heredoc. Only the validated version and
            # bump type are expanded. The release-run marker is appended so
            # finalize can resolve the producing run without depending on the
            # later stamping step succeeding.
            {
              cat <<BODY_EOF
          <!-- Automated release PR created by the Release workflow. -->

          ## Release v${NEW_VERSION}

          | Item | Value |
          |------|-------|
          | Version | ${NEW_VERSION} |
          | Bump type | ${BUMP_TYPE} |

          ### Changes included

          BODY_EOF
              printf '%s\n' "$SUMMARY"
              cat <<'FOOTER_EOF'

          ---

          _This PR was created automatically by the Release workflow. Merging it publishes the release: the tag and GitHub Release are finalized after this PR reaches `main`._
          FOOTER_EOF
              printf '%s\n' "$marker"
            } > pr-body.md
            pr_number=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: release v${NEW_VERSION}" \
              --body-file pr-body.md)
            pr_number=$(printf '%s' "$pr_number" | grep -oE '[0-9]+$')
            echo "Created PR #${pr_number} for $BRANCH."
          fi

          {
            echo "pr_number=${pr_number}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp release run into PR body
        # Decoupled from PR creation so a transient API failure (e.g. a missing
        # token scope) can NEVER block the Mergify queue step. The marker is already written
        # into the body at creation time; this re-stamp keeps a *reused* PR
        # pointed at the latest run. continue-on-error guarantees the Mergify queue
        # step below still runs even if this edit fails.
        id: stamp
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- shiftyar-release-run:${RUN_ID} -->"
          body=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          { printf '%s\n' "$body" | grep -v 'shiftyar-release-run:' || true; } > pr-body-clean.md
          printf '%s\n%s\n' "$(cat pr-body-clean.md)" "$marker" > pr-body-stamped.md
          gh pr edit "$PR_NUMBER" --body-file pr-body-stamped.md

      - name: Queue release PR with Mergify
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        run: |
          # The release PR MUST be merged by Mergify, not by
          # github-actions[bot] auto-merge: pushes by github-actions[bot]
          # do not trigger a new workflow run, so a bot-merged release PR
          # would never run FINALIZE (v0.2.1: PR #46 auto-merged, no
          # finalize run). Mergify merges with its own app token, and
          # that push does trigger FINALIZE.
          # Idempotent: do not queue twice on re-runs.
          if gh pr view "$PR_NUMBER" --json comments \
            --jq '.comments[] | select(.author.login == "github-actions[bot]") | .body' \
            | grep -q '@mergifyio queue'; then
            echo "PR #${PR_NUMBER} already queued with Mergify."
            exit 0
          fi
          if ! gh pr comment "$PR_NUMBER" --body '@mergifyio queue'; then
            echo "::error::Failed to queue PR #${PR_NUMBER} with Mergify." >&2
            echo "Mergify must be installed with queueing enabled for this repo; do NOT work around by merging manually or pushing to main." >&2
            exit 1
          fi
          echo "PR #${PR_NUMBER} queued with Mergify; it merges after required checks pass, and that merge triggers FINALIZE."

      - name: Summary - release prepared
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          BUMP_TYPE: ${{ steps.parse.outputs.bump_type }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        run: |
          {
            echo "### ✅ Release v${NEW_VERSION} prepared"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Version | ${NEW_VERSION} |"
            echo "| Bump type | ${BUMP_TYPE} |"
            echo "| PR | #${PR_NUMBER} (queued with Mergify) |"
            echo "| Tag | created after PR merges |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary - tag exists
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          {
            echo "### ⏭️ Release skipped"
            echo ""
            echo "Tag v${NEW_VERSION} already exists."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary - no app changes
        if: steps.detect.outputs.release_needed == 'false'
        run: |
          {
            echo "### ⏭️ Release skipped"
            echo ""
            echo "No application code changes detected."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    # Manual releases, unchanged from before: a v* tag push publishes a
    # full release, a workflow dispatch publishes a draft test release.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build packages
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"; else TAG="$INPUT_TAG"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p pkg/app
          cp -r server web package.json pkg/app/
          echo "${TAG#v}" > pkg/app/version.txt
          cd pkg
          zip -r ../shiftyar-app.zip app
          cd ..
          zip -j shiftyar-launcher.zip launcher/shiftyar-launcher.cmd launcher/update.ps1 launcher/README.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$TAG" shiftyar-app.zip shiftyar-launcher.zip --draft --title "$TAG" --notes "Draft test release for the Windows launcher (not followed by auto-update)."
          else
            gh release create "$TAG" shiftyar-app.zip shiftyar-launcher.zip --title "$TAG" --notes "Shiftyar app package for the Windows launcher auto-update, plus the launcher files."
          fi
