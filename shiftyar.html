<title>شیفت‌یار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
/* مفهوم: یک تختهٔ برنامهٔ شیفتِ ایستگاه پرستاری؛ شبکهٔ فشرده، رنگ بخش‌ها تنها رنگ‌های پررنگ صفحه‌اند. */
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --surface2: #f4f6fa;
  --ink: #14202f;
  --muted: #5a6779;
  --line: #d6dce6;
  --accent: #2457d6;
  --accent-ink: #ffffff;
  --hol: #fbe9e7;
  --hol-ink: #b3362b;
  --warn: #b45309;
  --ok: #1b7f5a;
  --today: #2457d6;
  --font-ui: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
  --font-display: 'Lalezar', 'Vazirmatn', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --surface: #161d28; --surface2: #1b2431; --ink: #e6ecf4; --muted: #9aa7b8; --line: #2a3545;
    --accent: #6c93ff; --accent-ink: #0b1220; --hol: #3a1d1b; --hol-ink: #ff9a8f; --warn: #f2b357; --ok: #5ad1a2; --today: #6c93ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #161d28; --surface2: #1b2431; --ink: #e6ecf4; --muted: #9aa7b8; --line: #2a3545;
  --accent: #6c93ff; --accent-ink: #0b1220; --hol: #3a1d1b; --hol-ink: #ff9a8f; --warn: #f2b357; --ok: #5ad1a2; --today: #6c93ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.7; direction: rtl;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { direction: ltr; unicode-bidi: isolate; display: inline-block; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 700; }
small, .muted { color: var(--muted); }
.wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* سربرگ */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: 0; }
.brand small { font-size: 12px; }
.save { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.save i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.save.saving i { background: var(--warn); }
.save.error i { background: var(--hol-ink); }

nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
nav.tabs button {
  background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer;
  color: var(--muted); white-space: nowrap; font-weight: 500;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

/* ابزارها */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.bar .sp { flex: 1 1 auto; }
.btn {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; min-height: 32px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--hol-ink); }
.btn.arm { background: var(--hol-ink); color: var(--surface); border-color: var(--hol-ink); }
.btn.sm { padding: 1px 9px; min-height: 26px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=number], input[type=tel], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; min-height: 32px; max-width: 100%;
}
input[type=color] { width: 38px; height: 32px; padding: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
textarea { width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; direction: ltr; text-align: left; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f > input, label.f > select { color: var(--ink); font-size: 14px; }
label.chk { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.month-nav { display: inline-flex; align-items: center; gap: 4px; }
.month-nav .lab { min-width: 130px; text-align: center; font-weight: 700; font-size: 16px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.note { color: var(--muted); font-size: 12px; }
.msg { padding: 6px 10px; border-radius: 6px; background: var(--hol); color: var(--hol-ink); font-size: 13px; }
.msg.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty b { color: var(--ink); font-size: 15px; }

/* قلم رنگ‌آمیزی */
.brush { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.brush .lab { font-size: 12px; color: var(--muted); margin-inline-end: 2px; }
.brush button {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; min-height: 30px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--line); cursor: pointer;
}
.brush button b { font-size: 13px; }
.brush button small { font-size: 11px; }
.brush button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.brush button[aria-pressed="true"] small { color: inherit; opacity: .85; }
.brush .gap { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }

/* شبکهٔ برنامه */
.rwrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: 72vh; }
table.roster { border-collapse: separate; border-spacing: 0; font-size: 12px; }
table.roster th, table.roster td { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); text-align: center; padding: 0; }
table.roster thead th { position: sticky; top: 0; z-index: 3; background: var(--surface2); height: 40px; min-width: 30px; font-weight: 500; }
table.roster thead th small { display: block; font-size: 10px; line-height: 1; }
table.roster thead th.hol, table.roster td.hol { background: var(--hol); }
table.roster thead th.hol { color: var(--hol-ink); }
table.roster thead th.today { box-shadow: inset 0 -3px 0 var(--today); font-weight: 700; }
table.roster .nm {
  position: sticky; right: 0; z-index: 2; background: var(--surface); text-align: right; min-width: 150px; max-width: 170px;
  padding: 3px 12px 3px 8px; border-left: 2px solid var(--line);
}
table.roster thead .nm { z-index: 4; background: var(--surface2); }
table.roster .nm { border-right: 6px solid var(--dc, var(--line)); }
table.roster .nm b { display: block; font-weight: 600; font-size: 13px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.roster .nm small { font-size: 11px; line-height: 1.2; display: block; }
table.roster td.cell { width: 30px; min-width: 30px; height: 40px; cursor: pointer; user-select: none; -webkit-user-select: none; }
table.roster td.cell:hover { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
table.roster td.cell.hol:hover { background: color-mix(in srgb, var(--accent) 12%, var(--hol)); }
table.roster td.sum { min-width: 62px; padding: 0 6px; white-space: nowrap; background: var(--surface); }
table.roster thead th.sum { min-width: 62px; padding: 0 6px; white-space: nowrap; font-size: 11px; }
table.roster td.sum.ot.neg { color: var(--hol-ink); }
table.roster td.sum.ot.pos { color: var(--ok); font-weight: 700; }
table.roster tr.grp td { background: var(--surface2); text-align: right; padding: 2px 12px; font-weight: 700; font-size: 12px; position: sticky; right: 0; border-right: 6px solid var(--dc, var(--line)); }
.c {
  display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin: auto; border-radius: 5px;
  font-size: 12px; font-weight: 700; line-height: 1; direction: ltr;
  background: color-mix(in srgb, var(--dc, var(--accent)) 26%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--dc, var(--accent)) 75%, var(--surface));
}
.c.sp { background: repeating-linear-gradient(135deg, var(--surface2) 0 4px, var(--line) 4px 5px); border-color: var(--line); color: var(--muted); font-weight: 600; direction: rtl; }
.c.SK { color: var(--accent); border-color: var(--accent); }
.c.AB { color: var(--hol-ink); border-color: var(--hol-ink); background: var(--hol); }
td.warn .c, .pc-day.warn .c { outline: 2px solid var(--warn); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .c { width: 26px; height: 22px; margin: 0; font-size: 11px; }

/* تقویم فرد */
.pcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.pcal .wh { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0; }
.pc-day { min-height: 74px; border: 1px solid var(--line); border-radius: 6px; padding: 4px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; user-select: none; }
.pc-day.hol { background: var(--hol); }
.pc-day.today { box-shadow: inset 0 0 0 2px var(--today); }
.pc-day:hover { border-color: var(--accent); }
.pc-day .d { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.pc-day.hol .d { color: var(--hol-ink); }
.pc-day .d em { font-style: normal; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-day .c { width: 34px; }
.pc-day.blank { visibility: hidden; border: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--surface2); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; }
.stat small { font-size: 11px; }
.stat b { font-size: 17px; font-weight: 700; }
.stat.neg b { color: var(--hol-ink); }
.stat.pos b { color: var(--ok); }

/* جدول‌ها */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th { background: var(--surface2); font-weight: 600; font-size: 12px; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n, table.t th.n { text-align: center; }
table.t tfoot td { font-weight: 700; background: var(--surface2); }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; background: var(--dc, var(--line)); vertical-align: -1px; margin-inline-end: 6px; }
.pill { display: inline-block; font-size: 11px; padding: 0 8px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); }
details.warns { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 12px; }
details.warns summary { cursor: pointer; font-weight: 600; }
details.warns ul { margin: 8px 0 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.rows { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seg-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.split { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .split { grid-template-columns: minmax(0, 1fr); } .brand h1 { font-size: 24px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* حالت سرور */
.pc-day.ro { cursor: default; }
.pc-day.ro:hover { border-color: var(--line); }
.who { white-space: nowrap; }
fieldset { min-width: 0; }
#u-notice b { font-weight: 700; }

/* ستون اضافه/کسر همیشه دیده شود، حتی وقتی جدول افقی اسکرول می‌شود */
table.roster td.sum.ot, table.roster thead th.sum:last-child { position: sticky; left: 0; z-index: 2; border-right: 2px solid var(--line); background: var(--surface); }
table.roster thead th.sum:last-child { z-index: 4; background: var(--surface2); }
table.roster { width: 100%; }

</style>

<script>
/* core.js — محاسبات خالص (بدون DOM): تقویم شمسی، شیفت‌ها، تعطیلات، موظفی و اضافه‌کار */
(function (root) {
  'use strict';

  /* ---------- تقویم جلالی (الگوریتم jalaali-js) ---------- */
  const div = (a, b) => Math.trunc(a / b);
  const mod = (a, b) => a - Math.trunc(a / b) * b;
  const BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

  function jalCal(jy, withoutLeap) {
    const bl = BREAKS.length;
    const gy = jy + 621;
    let leapJ = -14, jp = BREAKS[0], jm, jump = 0, leap, n;
    if (jy < jp || jy >= BREAKS[bl - 1]) throw new Error('Invalid Jalaali year ' + jy);
    for (let i = 1; i < bl; i += 1) {
      jm = BREAKS[i];
      jump = jm - jp;
      if (jy < jm) break;
      leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
      jp = jm;
    }
    n = jy - jp;
    leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    const march = 20 + leapJ - leapG;
    if (withoutLeap) return { gy, march };
    if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
    leap = mod(mod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;
    return { leap, gy, march };
  }

  function g2d(gy, gm, gd) {
    let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
    d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
    return d;
  }
  function d2g(jdn) {
    let j = 4 * jdn + 139361631;
    j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = div(mod(j, 1461), 4) * 5 + 308;
    const gd = div(mod(i, 153), 5) + 1;
    const gm = mod(div(i, 153), 12) + 1;
    const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
    return { gy, gm, gd };
  }
  function j2d(jy, jm, jd) {
    const r = jalCal(jy, true);
    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
  }
  function d2j(jdn) {
    const gy = d2g(jdn).gy;
    let jy = gy - 621;
    const r = jalCal(jy, false);
    const jdn1f = g2d(gy, 3, r.march);
    let k = jdn - jdn1f, jm, jd;
    if (k >= 0) {
      if (k <= 185) {
        jm = 1 + div(k, 31);
        jd = mod(k, 31) + 1;
        return { jy, jm, jd };
      }
      k -= 186;
    } else {
      jy -= 1;
      k += 179;
      if (r.leap === 1) k += 1;
    }
    jm = 7 + div(k, 30);
    jd = mod(k, 30) + 1;
    return { jy, jm, jd };
  }
  const isLeap = (jy) => jalCal(jy, false).leap === 0;
  const monthLen = (jy, jm) => (jm <= 6 ? 31 : jm <= 11 ? 30 : isLeap(jy) ? 30 : 29);
  /** ۰ = شنبه … ۶ = جمعه */
  const weekdayOf = (jdn) => mod(jdn + 2, 7);
  function todayJdn() {
    const d = new Date();
    return g2d(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }

  const MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  const WD_SHORT = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];
  const WD_FULL = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];

  /* ---------- قالب‌بندی ---------- */
  const FA = '۰۱۲۳۴۵۶۷۸۹';
  const fa = (s) => String(s).replace(/\d/g, (d) => FA[d]);
  const toLatin = (s) =>
    String(s).replace(/[۰-۹]/g, (d) => FA.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const pad2 = (n) => String(n).padStart(2, '0');
  /** دقیقه → «ساعت:دقیقه» با ارقام فارسی */
  function fmtHM(min) {
    const neg = min < 0;
    const m = Math.round(Math.abs(min));
    return (neg ? '−' : '') + fa(Math.floor(m / 60)) + ':' + fa(pad2(m % 60));
  }
  /** همان فرمت با ارقام لاتین (برای خروجی فایل) */
  function fmtHMlatin(min) {
    const neg = min < 0;
    const m = Math.round(Math.abs(min));
    return (neg ? '-' : '') + Math.floor(m / 60) + ':' + pad2(m % 60);
  }
  const fmtDate = (jdn) => {
    const d = d2j(jdn);
    return fa(d.jy) + '/' + fa(pad2(d.jm)) + '/' + fa(pad2(d.jd));
  };
  const fmtDateLatin = (jdn) => {
    const d = d2j(jdn);
    return d.jy + '/' + pad2(d.jm) + '/' + pad2(d.jd);
  };
  function parseDate(str) {
    const m = /^\s*(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\s*$/.exec(toLatin(str));
    if (!m) return null;
    const jy = +m[1], jm = +m[2], jd = +m[3];
    if (jm < 1 || jm > 12 || jd < 1 || jy < 1300 || jy > 1500 || jd > monthLen(jy, jm)) return null;
    return j2d(jy, jm, jd);
  }
  const toMin = (hhmm) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(toLatin(hhmm || ''));
    return m ? +m[1] * 60 + +m[2] : 0;
  };

  /* ---------- پیش‌فرض‌ها ---------- */
  const SPECIAL = {
    LV: { name: 'مرخصی استحقاقی', short: 'مر', credit: true },
    LU: { name: 'مرخصی بدون حقوق', short: 'بح', credit: false },
    SK: { name: 'استعلاجی', short: 'اس', credit: true },
    RS: { name: 'استراحت', short: 'را', credit: false },
    AB: { name: 'غیبت', short: 'غ', credit: false },
  };
  const CONTRACTS = { company: 'شرکتی', t4: 'تبصره ۴', official: 'رسمی' };

  const defaultShifts = () => [
    { code: 'M', name: 'صبح', kind: 'simple', segs: [{ o: 0, s: '07:00', e: '13:30' }] },
    { code: 'A', name: 'عصر', kind: 'simple', segs: [{ o: 0, s: '13:00', e: '19:30' }] },
    { code: 'N', name: 'شب', kind: 'simple', segs: [{ o: 0, s: '19:00', e: '07:30' }] },
    { code: 'MA', name: 'صبح و عصر', kind: 'combo', refs: [{ code: 'M', o: 0 }, { code: 'A', o: 0 }] },
    { code: 'AN', name: 'عصر و شب', kind: 'combo', refs: [{ code: 'A', o: 0 }, { code: 'N', o: 0 }] },
    { code: 'NM', name: 'شب و صبحِ روز بعد', kind: 'combo', refs: [{ code: 'N', o: 0 }, { code: 'M', o: 1 }] },
    { code: 'MN', name: 'صبح و شب', kind: 'combo', refs: [{ code: 'M', o: 0 }, { code: 'N', o: 0 }] },
  ];
  const defaultHolidays = () => [

  function shiftIvs(shifts, code, depth) {
    depth = depth || 0;
    const sh = shifts.find((s) => s.code === code);
    if (!sh || depth > 3) return [];
    const all = [];

        }

/* ---------- ذخیره‌سازی ---------- */
const Store = {

  /** تماس با API سرور؛ خطا را با {status, message} پرتاب می‌کند */
  async api(method, path, body) {
    const opt = { method, credentials: 'same-origin', headers: { 'X-Requested-With': 'shiftyar' } };

  },
  /** بعد از ورود موفق: بارگذاری پیکربندی و شروع بررسی دوره‌ای */
  async enterApp() {

  },
  async ensureMonth(jy, jm) {
    if (this.mode === 'server') {
      const id = monthId(jy, jm);
      if (this.loaded.has(id)) return;
      const a = j2d(jy, jm, 1), b = a + monthLen(jy, jm) - 1;

      const s = await this.db.doc('assign/' + id).get();

  },
  mergeMonth(jy, jm, m) {
    const a = j2d(jy, jm, 1);

      const i = k.lastIndexOf(':');

      try { await this.flushServer(); } finally { this.busy = false; if (this.again) { this.again = false; this.flush(); } }
      return;
    }
    this.busy = true;
    const d = this.dirty;
    const cfg = d.cfg, log = d.log, months = Array.from(d.months);
    d.cfg = false; d.log = false; d.months = new Set();
    try {
      if (this.mode === 'local') {
        localStorage.setItem('shiftyar.v1', JSON.stringify({ cfg: DB.cfg, assign: DB.assign, log: DB.log }));
      } else if (this.mode === 'db') {
        if (cfg) await this.db.doc('app/config').set(Object.assign({ v: 1 }, DB.cfg));
        for (const id of months) {
          if (!this.loaded.has(id)) continue;
          const [y, m] = id.split('-').map(Number);
          await this.db.doc('assign/' + id).set(this.monthDoc(y, m));
        }
        if (log) await this.db.doc('app/log').set({ items: DB.log });
      }
      this.err = '';
      this.setStatus('saved');
    } catch (e) {
      if (cfg) d.cfg = true; if (log) d.log = true; months.forEach((x) => d.months.add(x));
      this.fail(e);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.flush(); }
    }
  },
  /** جایگزینی کل داده‌ها (بازیابی پشتیبان یا پاک‌سازی) */
  async replaceAll(cfg, assign, log) {
    await this.loadAll();
    const oldIds = Array.from(this.loaded);
    DB.cfg = cfg; DB.assign = assign; DB.log = log;
    const newIds = new Set();
    for (const pid in assign) for (const j in assign[pid]) { const d = d2j(+j); newIds.add(monthId(d.jy, d.jm)); }
    if (this.mode === 'db') {
      for (const id of oldIds) if (!newIds.has(id)) { try { await this.db.doc('assign/' + id).delete(); } catch (e) { this.fail(e); } }
      this.loaded = new Set(newIds);
    }
    this.dirty.cfg = true; this.dirty.log = true; this.dirty.months = new Set(newIds);
    this.schedule();
  },
};

/* ---------- عملیات روی داده ---------- */
function logEv(text) {
  if (isServer()) return; // سرور خودش با نام کاربر ثبت می‌کند
  DB.log.unshift({ t: Date.now(), x: text });
  if (DB.log.length > 200) DB.log.length = 200;
  Store.touchLog();
}
function setAssign(pid, j, code, stroke) {
  if (!canEdit()) return false;
  const mine = (DB.assign[pid] = DB.assign[pid] || {});
  const old = mine[j];
  if (old === code || (!old && !code)) return false;
  if (code) mine[j] = code; else delete mine[j];
  if (stroke) stroke.push({ pid, j, old, nw: code });
  if (isServer()) Store.touchCell(pid, j, code); else Store.touchMonth(j);
  return true;
}
function finishStroke(stroke, label) {
  if (!stroke || !stroke.length) return;
  ui.undo.push(stroke);
  if (ui.undo.length > 50) ui.undo.shift();
  if (stroke.length === 1) {
    const s = stroke[0], p = person(s.pid);
    logEv(`${p ? pname(p) : '؟'} — ${fmtDate(s.j)}: ${codeLabel(s.old)} ← ${codeLabel(s.nw)}`);
  } else logEv(`${fa(stroke.length)} خانه تغییر کرد (${label || 'قلم'})`);
  const btn = $('[data-act="undo"]'); if (btn) btn.disabled = false;
}

const repDept = () => { const el = $('#rep-dept'); return el ? el.value : 'all'; };
function repRange() {
  const { a, b } = monthInfo();
  if (ui.rep.from == null) { ui.rep.from = a; ui.rep.to = b; }
  return { from: ui.rep.from, to: ui.rep.to };
}
function buildReport() {
  const { from, to } = repRange();
  const hm = holidayMap(DB.cfg.settings, DB.cfg.holidays, from, to);
  let ps = sortedPeople();
  if (ui.rep.dept === 'none') ps = ps.filter((p) => !dept(p.deptId));
  else if (ui.rep.dept !== 'all') ps = ps.filter((p) => p.deptId === ui.rep.dept);
  const rows = ps.map((p) => ({ p, r: computeRange(dbv(), p, from, to, hm) }));
  const used = new Set();
  rows.forEach((x) => Object.keys(x.r.counts).forEach((k) => used.add(k)));
  const shiftCols = DB.cfg.shifts.map((s) => s.code).filter((c) => used.has(c));
  const spCols = Object.keys(SPECIAL).filter((c) => used.has(c));
  return { from, to, rows, shiftCols, spCols, hm };
}
function viewRep() {
  const R = buildReport();
  const cap = DB.cfg.settings.otCapH * 60;
  const days = R.to - R.from + 1;

  R.rows.forEach((x) => { for (const k in tot) tot[k] += x.r[k]; });
  const head = `<th>کد</th><th>نام</th><th>بخش</th><th>قرارداد</th><th class="n">موظفی</th><th class="n">کارکرد واقعی</th><th class="n">با ضریب</th><th class="n">اعتبار مرخصی</th><th class="n">اضافه / کسر</th>
    ${R.shiftCols.map((c) => `<th class="n">${esc(c)}</th>`).join('')}${R.spCols.map((c) => `<th class="n">${SPECIAL[c].name}</th>`).join('')}`;
  const body = R.rows.map(({ p, r }) => `<tr><td>${esc(p.code || '—')}</td><td>${esc(pname(p))}</td><td>${dept(p.deptId) ? `<span class="dot" style="--dc:${esc(dept(p.deptId).color)}"></span>${esc(dept(p.deptId).name)}` : '—'}</td><td>${CONTRACTS[p.contract] || ''}</td>

    <td class="n" style="${r.overtime < 0 ? 'color:var(--hol-ink)' : cap > 0 && r.overtime > cap ? 'color:var(--warn);font-weight:700' : ''}">${hmH(r.overtime)}</td>
    ${R.shiftCols.map((c) => `<td class="n">${r.counts[c] ? fa(r.counts[c]) : '·'}</td>`).join('')}${R.spCols.map((c) => `<td class="n">${r.counts[c] ? fa(r.counts[c]) : '·'}</td>`).join('')}</tr>`).join('');
  const foot = `<tr><td colspan="4">جمع</td><td class="n">${hmH(tot.duty)}</td><td class="n">${hmH(tot.actual)}</td><td class="n">${hmH(tot.weighted)}</td><td class="n">${hmH(tot.credit)}</td><td class="n">${hmH(tot.overtime)}</td><td colspan="${R.shiftCols.length + R.spCols.length}"></td></tr>`;
  // جمع‌بندی بخش‌ها
  const groups = {};
  R.rows.forEach(({ p, r }) => {
    const k = dept(p.deptId) ? p.deptId : '';
    const g = (groups[k] = groups[k] || { n: 0, duty: 0, actual: 0, weighted: 0, overtime: 0, counts: {} });
    g.n++; g.duty += r.duty; g.actual += r.actual; g.weighted += r.weighted; g.overtime += r.overtime;
    for (const c in r.counts) g.counts[c] = (g.counts[c] || 0) + r.counts[c];
  });
  const gRows = Object.keys(groups).map((k) => {
    const g = groups[k], d = dept(k);
    return `<tr><td>${d ? `<span class="dot" style="--dc:${esc(d.color)}"></span>${esc(d.name)}` : 'بدون بخش'}</td><td class="n">${N(fa(g.n))}</td><td class="n">${hmH(g.actual)}</td><td class="n">${hmH(g.weighted)}</td><td class="n">${hmH(g.overtime)}</td>
      ${R.shiftCols.map((c) => `<td class="n">${g.counts[c] ? fa(g.counts[c]) : '·'}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="panel"><div class="bar">
      <label class="f">از تاریخ<input type="text" id="rep-from" dir="ltr" size="11" value="${fmtDateLatin(R.from)}"></label>
      <label class="f">تا تاریخ<input type="text" id="rep-to" dir="ltr" size="11" value="${fmtDateLatin(R.to)}"></label>
      ${role() === 'staff' ? '' : `<label class="f">بخش${deptSelect('rep-dept', ui.rep.dept, true)}</label>`}

      <button class="btn sm" data-act="repweek" style="align-self:flex-end">هفتهٔ جاری</button>
      <button class="btn sm" data-act="reptoday" style="align-self:flex-end">امروز</button>

    <div class="note">بازه: ${N(fmtDate(R.from))} تا ${N(fmtDate(R.to))} (${N(fa(days))} روز). موظفی هر نفر برای این بازه: ${hmH((days - Object.values(R.hm).filter(Boolean).length) * DB.cfg.settings.dutyMin)}.
    تاریخ را به شکل ۱۴۰۵/۰۷/۲۵ بنویسید.</div><div id="rep-msg"></div></div>
    ${R.rows.length ? `<div class="tw"><table class="t"><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
      <h2>برنامهٔ کلی بخش‌ها</h2>
      <div class="tw"><table class="t"><thead><tr><th>بخش</th><th class="n">نفر</th><th class="n">کارکرد واقعی</th><th class="n">با ضریب</th><th class="n">اضافه / کسر</th>${R.shiftCols.map((c) => `<th class="n">تعداد ${esc(c)}</th>`).join('')}</tr></thead><tbody>${gRows}</tbody></table></div>`
      : '<div class="panel empty"><b>پرسنلی برای گزارش نیست</b></div>'}`;
}
function csvText() {
  const R = buildReport();
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const h = ['کد پرسنلی', 'نام', 'بخش', 'قرارداد', 'موظفی', 'کارکرد واقعی', 'کارکرد با ضریب', 'اعتبار مرخصی', 'اضافه/کسر', 'اضافه/کسر (ساعت اعشاری)']
    .concat(R.shiftCols.map((c) => 'تعداد ' + c)).concat(R.spCols.map((c) => SPECIAL[c].name));
  const lines = [h.map(q).join(',')];
  R.rows.forEach(({ p, r }) => {
    lines.push([p.code || '', pname(p), (dept(p.deptId) || {}).name || '', CONTRACTS[p.contract] || '', fmtHMlatin(r.duty), fmtHMlatin(r.actual), fmtHMlatin(r.weighted), fmtHMlatin(r.credit), fmtHMlatin(r.overtime), (r.overtime / 60).toFixed(2)]
      .concat(R.shiftCols.map((c) => r.counts[c] || 0)).concat(R.spCols.map((c) => r.counts[c] || 0)).map(q).join(','));
  });
  return { name: `report-${fmtDateLatin(R.from).replace(/\//g, '')}-${fmtDateLatin(R.to).replace(/\//g, '')}.csv`, text: '﻿' + lines.join('\r\n') };
}

async function saveFile(filename, data, label) {
  if (Store.dl) {
    try { await Store.dl.save({ filename, data }); return true; }
    catch (e) { if (e && e.code === 'declined') return false; }
  } else if (!window.claude) {
    // صفحهٔ معمولی (سرور یا فایل محلی): دانلود مستقیم مرورگر
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'text/plain;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      return true;
    } catch (e) { /* ادامه با نمایش متن */ }
  }
  showText(label || filename, typeof data === 'string' ? data : '');
  return false;
}

let painting = false, stroke = null, strokeFirst = true;
function applyBrush(td) {
  const pid = td.dataset.pid, j = +td.dataset.j;
  const old = (DB.assign[pid] || {})[j];
  let nw = ui.brush === 'ERASE' ? undefined : ui.brush;
  if (strokeFirst && old === nw) nw = undefined; // کلیک دوباره = پاک کردن
  strokeFirst = false;
  if (setAssign(pid, j, nw, stroke)) { if (ui.tab === 'pcal') refreshPcal(); else refreshRow(pid); }
}
document.addEventListener('pointerdown', (e) => {
  if (e.button > 0 || !canEdit()) return;
  const td = e.target.closest('.cell[data-pid]');
  if (!td || !(ui.tab === 'sched' || ui.tab === 'pcal')) return;
  painting = true; stroke = []; strokeFirst = true;
  applyBrush(td);
  e.preventDefault();
});
document.addEventListener('pointerover', (e) => {
  if (!painting) return;
  const td = e.target.closest('.cell[data-pid]');
  if (td) applyBrush(td);
});
function endStroke() { if (!painting) return; painting = false; finishStroke(stroke, ui.brush === 'ERASE' ? 'پاک‌کردن' : codeLabel(ui.brush)); stroke = null; }
document.addEventListener('pointerup', endStroke);
document.addEventListener('pointercancel', endStroke);
document.addEventListener('keydown', (e) => {
  const td = e.target.closest && e.target.closest('.cell[data-pid]');
  if (!td || !canEdit()) return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); stroke = []; strokeFirst = true; const pid = td.dataset.pid, j = td.dataset.j;
    applyBrush(td); finishStroke(stroke, codeLabel(ui.brush)); stroke = null;
    const again = $(`.cell[data-pid="${pid}"][data-j="${j}"]`); if (again) again.focus();
    return;
  }
  const dir = { ArrowLeft: [1, 0], ArrowRight: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!dir) return;
  e.preventDefault();
  const pid = td.dataset.pid, j = +td.dataset.j;
  let next = null;
  if (ui.tab === 'pcal') next = $(`.cell[data-j="${j + dir[0] + dir[1] * 7}"]`);
  else if (dir[0]) next = $(`.cell[data-pid="${pid}"][data-j="${j + dir[0]}"]`);
  else { const tr = td.closest('tr'); let r = tr; do { r = dir[1] > 0 ? r.nextElementSibling : r.previousElementSibling; } while (r && r.classList.contains('grp')); if (r) next = $(`.cell[data-pid="${r.dataset.pid}"][data-j="${j}"]`); }
  if (next) { $$('.cell[tabindex="0"]').forEach((c) => c.setAttribute('tabindex', '-1')); next.setAttribute('tabindex', '0'); next.focus(); }
});

/* ---------- کلیک‌ها ---------- */
async function copyPattern(src) {
  const { a, b } = monthInfo();
  const ps = visiblePeople();
  if (src === 'pm') {
    const pm = ui.jm === 1 ? { jy: ui.jy - 1, jm: 12 } : { jy: ui.jy, jm: ui.jm - 1 };
    await Store.ensureMonth(pm.jy, pm.jm);
  } else await Store.ensureRange(a - +src, a);
  const st = [];
  for (const p of ps) {
    for (let j = a; j <= b; j++) {
      let from;
      if (src === 'pm') { const d = d2j(j); const dd = d.jd; from = dd <= monthLen(ui.jm === 1 ? ui.jy - 1 : ui.jy, ui.jm === 1 ? 12 : ui.jm - 1) ? j2d(ui.jm === 1 ? ui.jy - 1 : ui.jy, ui.jm === 1 ? 12 : ui.jm - 1, dd) : null; }
      else from = j - +src;
      if (from == null) continue;
      const code = (DB.assign[p.id] || {})[from];
      if (code) setAssign(p.id, j, code, st);
    }
  }
  finishStroke(st, 'کپی الگو');
  if (!st.length) flash('چیزی برای کپی پیدا نشد؛ مبدأ خالی است یا تغییری لازم نبود.', false);
}
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act],[data-tab],[data-brush]');
  if (!t) return;
  if (t.dataset.brush) {
    ui.brush = t.dataset.brush;
    $$('[data-brush]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.brush === ui.brush)));
    return;
  }
  if (t.dataset.tab) { ui.tab = t.dataset.tab; ui.shiftDraft = null; await render(); window.scrollTo(0, 0); return; }
  if (t.dataset.confirm && !t.classList.contains('arm')) {
    t.classList.add('arm'); t.dataset.orig = t.textContent; t.textContent = t.dataset.confirm;
    setTimeout(() => { if (t.isConnected && t.classList.contains('arm')) { t.classList.remove('arm'); t.textContent = t.dataset.orig; } }, 4500);
    return;
  }
  const act = t.dataset.act, id = t.dataset.id;
  const cfg = DB.cfg;
  switch (act) {
    case 'mprev': ui.jm--; if (ui.jm < 1) { ui.jm = 12; ui.jy--; } ui.rep.from = null; ui.undo = []; return render();
    case 'mnext': ui.jm++; if (ui.jm > 12) { ui.jm = 1; ui.jy++; } ui.rep.from = null; ui.undo = []; return render();
    case 'mtoday': { const d = d2j(todayJdn()); ui.jy = d.jy; ui.jm = d.jm; ui.rep.from = null; ui.undo = []; return render(); }
    case 'undo': {
      const st = ui.undo.pop(); if (!st) return;
      const pids = new Set();
      for (let i = st.length - 1; i >= 0; i--) { setAssign(st[i].pid, st[i].j, st[i].old); pids.add(st[i].pid); }
      logEv(`بازگردانی ${fa(st.length)} خانه`);
      return render();
    }
    case 'copypat': { await copyPattern($('#copy-src').value); return render(); }
    case 'clearmonth': {
      const { a, b } = monthInfo(); const st = [];
      for (const p of visiblePeople()) for (let j = a; j <= b; j++) setAssign(p.id, j, undefined, st);
      finishStroke(st, 'پاک‌کردن ماه'); return render();
    }
    case 'clearsample': {
      await Store.replaceAll(Object.assign(normalizeCfg(cfg), { people: [], depts: [], sample: false }), {}, []);
      ui.undo = []; return render();
    }
    /* پرسنل */
    case 'editperson': ui.editPerson = id; return render();
    case 'cancelperson': ui.editPerson = null; return render();
    case 'delperson': {
      const mine = DB.assign[id] || {}; const p = person(id);
      cfg.people = cfg.people.filter((x) => x.id !== id);
      Object.keys(mine).forEach((j) => Store.touchMonth(+j));
      delete DB.assign[id];
      Store.touchCfg(); logEv(`حذف پرسنل: ${p ? pname(p) : ''}`); return render();
    }
    /* بخش‌ها */
    case 'deldept': {
      const d = dept(id); cfg.depts = cfg.depts.filter((x) => x.id !== id);
      cfg.people.forEach((p) => { if (p.deptId === id) p.deptId = ''; });
      if (ui.dept === id) ui.dept = 'all';
      Store.touchCfg(); logEv(`حذف بخش: ${d ? d.name : ''}`); return render();
    }
    /* شیفت‌ها */
    case 'newshift': ui.shiftDraft = { orig: null, code: '', name: '', kind: 'simple', segs: [{ o: 0, s: '08:00', e: '14:00' }], refs: [] }; return render();
    case 'editshift': { const s = shiftOf(id); ui.shiftDraft = JSON.parse(JSON.stringify(Object.assign({ segs: [], refs: [] }, s, { orig: s.code }))); if (!ui.shiftDraft.segs.length && s.kind !== 'combo') ui.shiftDraft.segs.push({ o: 0, s: '08:00', e: '14:00' }); return render(); }
    case 'cancelshift': ui.shiftDraft = null; return render();
    case 'addseg': ui.shiftDraft.segs.push({ o: 0, s: '08:00', e: '14:00' }); return render();
    case 'rmseg': ui.shiftDraft.segs.splice(+t.dataset.i, 1); return render();
    case 'addref': { const first = cfg.shifts.find((s) => s.kind !== 'combo' && s.code !== ui.shiftDraft.orig); ui.shiftDraft.refs.push({ code: first ? first.code : '', o: 0 }); return render(); }
    case 'rmref': ui.shiftDraft.refs.splice(+t.dataset.i, 1); return render();
    case 'delshift': {
      let used = 0; for (const pid in DB.assign) for (const j in DB.assign[pid]) if (DB.assign[pid][j] === id) used++;
      const inCombo = cfg.shifts.some((s) => s.kind === 'combo' && (s.refs || []).some((r) => r.code === id));
      if (used || inCombo) { flash(used ? `این شیفت ${fa(used)} بار در برنامه‌ها استفاده شده و حذف نمی‌شود.` : 'این شیفت در یک شیفت ترکیبی استفاده شده است.', false); return; }
      cfg.shifts = cfg.shifts.filter((s) => s.code !== id); if (ui.brush === id) ui.brush = 'ERASE';
      Store.touchCfg(); logEv(`حذف شیفت ${id}`); return render();
    }
    /* تعطیلات */
    case 'delhol': cfg.holidays = cfg.holidays.filter((h) => h.id !== id); Store.touchCfg(); logEv('حذف یک تعطیلی'); return render();
    /* گزارش */
    case 'repgo': {
      const f = parseDate($('#rep-from').value), to = parseDate($('#rep-to').value);
      if (f == null || to == null) return flash('تاریخ را به شکل ۱۴۰۵/۰۷/۲۵ بنویسید.', false, '#rep-msg');
      if (to < f) return flash('تاریخ پایان باید بعد از شروع باشد.', false, '#rep-msg');
      if (to - f > 400) return flash('بازه حداکثر ۴۰۰ روز می‌تواند باشد.', false, '#rep-msg');
      ui.rep.from = f; ui.rep.to = to; ui.rep.dept = repDept(); return render();
    }
    case 'repmonth': { const m = monthInfo(); ui.rep.from = m.a; ui.rep.to = m.b; ui.rep.dept = repDept(); return render(); }
    case 'repweek': { const T = todayJdn(), s = T - weekdayOf(T); ui.rep.from = s; ui.rep.to = s + 6; ui.rep.dept = repDept(); return render(); }
    case 'reptoday': { const T = todayJdn(); ui.rep.from = T; ui.rep.to = T; ui.rep.dept = repDept(); return render(); }
    case 'repcsv': { ui.rep.dept = repDept(); const c = csvText(); const ok = await saveFile(c.name, c.text, 'متن CSV'); if (ok) flash('فایل ذخیره شد.', true, '#rep-msg'); return; }
    /* حساب و کاربران (حالت سرور) */
    case 'logout': {
      try { await Store.api('POST', '/api/logout'); } catch (e) { /* حتی با خطا از برنامه خارج می‌شویم */ }
      ME.user = null; clearInterval(Store.pollTimer);
      Store.pending = new Map(); Store.loaded = new Set(); DB.assign = {}; DB.cfg = defaultCfg();
      ui.undo = []; usersState.list = []; usersState.edit = null; usersState.notice = ''; loginMsg = '';
      return render();
    }
    case 'dismissnotice': usersState.notice = ''; return render();
    case 'edituser': usersState.edit = usersState.list.find((u) => u.id === +id) || null; return render();
    case 'canceluser': usersState.edit = null; return render();
    case 'toggleuser': {
      const u = usersState.list.find((x) => x.id === +id);
      try { await Store.api('PATCH', '/api/users/' + id, { active: !u.active }); await render(); } catch (err) { await render(); flash(err.message, false); }
      return;
    }
    case 'deluser': {
      try { await Store.api('DELETE', '/api/users/' + id); await render(); } catch (err) { await render(); flash(err.message, false); }
      return;
    }
    case 'resetuser': {
      const u = usersState.list.find((x) => x.id === +id);
      try {
        const r = await Store.api('POST', `/api/users/${id}/reset`);
        usersState.notice = `گذرواژهٔ موقت <b>${esc(u ? u.code : '')}</b>: <span class="num">${esc(r.tempPassword)}</span> — فقط همین یک بار نمایش داده می‌شود.`;
        await render();
      } catch (err) { await render(); flash(err.message, false); }
      return;
    }
    case 'provision': {
      try {
        const r = await Store.api('POST', '/api/users/provision');
        usersState.notice = `${N(fa(r.created.length))} حساب ساخته شد. فهرست گذرواژه‌های موقت را پایین صفحه ببینید؛ فقط همین یک بار نمایش داده می‌شود.`;
        await render();
        const lines = ['کد کاربری\tنام\tگذرواژهٔ موقت'].concat(r.created.map((x) => `${x.code}\t${x.name}\t${x.tempPassword}`));
        showText('گذرواژه‌های موقت', lines.join('\n'));
      } catch (err) { await render(); flash(err.message, false); }
      return;
    }
    /* تنظیمات */
    case 'backup': {
      await Store.loadAll();
      const data = JSON.stringify({ app: 'shiftyar', v: 1, cfg: DB.cfg, assign: DB.assign, log: DB.log });
      const ok = await saveFile('shiftyar-backup-' + fmtDateLatin(todayJdn()).replace(/\//g, '') + '.json', data, 'متن پشتیبان');
      if (ok) flash('فایل پشتیبان ذخیره شد.', true, '#set-msg'); return;
    }
    case 'resetall': {
      await Store.replaceAll(defaultCfg(), {}, []); ui.undo = []; ui.editPerson = null; ui.dept = 'all'; return render();
    }
  }
});

/* ---------- فرم‌ها ---------- */
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), cfg = DB.cfg;
  if (f.id === 'f-person') {
    const rec = { first: (fd.get('first') || '').trim(), last: (fd.get('last') || '').trim(), code: toLatin((fd.get('code') || '').trim()), phone: toLatin((fd.get('phone') || '').trim()), contract: fd.get('contract'), deptId: fd.get('deptId') || '' };
    if (!rec.first && !rec.last) return flash('نام را بنویسید.', false, '#f-person-msg');
    if (rec.code && cfg.people.some((p) => p.code === rec.code && p.id !== ui.editPerson)) return flash('این کد پرسنلی قبلاً ثبت شده است.', false, '#f-person-msg');
    if (ui.editPerson) { Object.assign(person(ui.editPerson), rec); logEv('ویرایش پرسنل: ' + pname(rec)); }
    else { cfg.people.push(Object.assign({ id: uid('p') }, rec)); logEv('افزودن پرسنل: ' + pname(rec)); }
    ui.editPerson = null; Store.touchCfg(); render();
  } else if (f.id === 'f-dept') {
    const name = (fd.get('name') || '').trim(); if (!name) return;
    cfg.depts.push({ id: uid('d'), name, color: fd.get('color') }); Store.touchCfg(); logEv('افزودن بخش: ' + name); render();
  } else if (f.id === 'f-hol') {
    const jm = +fd.get('jm'), jd = +fd.get('jd'), name = (fd.get('name') || '').trim(), every = fd.get('every') === 'on', jy = +fd.get('jy');
    if (!name || !(jd >= 1 && jd <= 31)) return flash('روز و نام مناسبت را بنویسید.', false, '#f-hol-msg');
    if (!every && !(jy >= 1300)) return flash('سال را بنویسید.', false, '#f-hol-msg');
    cfg.holidays.push({ id: uid('h'), jy: every ? null : jy, jm, jd, name }); Store.touchCfg(); logEv(`افزودن تعطیلی: ${fa(jd)} ${MONTHS[jm - 1]} ${name}`); render();
  } else if (f.id === 'f-shift') {
    const d = ui.shiftDraft; d.code = d.code.trim();
    const err = validateShift(d, cfg.shifts, !d.orig);
    if (err) return flash(err, false, '#f-shift-msg');
    const rec = d.kind === 'combo' ? { code: d.code, name: d.name.trim(), kind: 'combo', refs: d.refs.map((r) => ({ code: r.code, o: +r.o || 0 })) }
      : { code: d.code, name: d.name.trim(), kind: 'simple', segs: d.segs.map((g) => ({ o: +g.o || 0, s: toLatin(g.s).padStart(5, '0'), e: toLatin(g.e).padStart(5, '0') })) };
    if (d.orig) cfg.shifts[cfg.shifts.findIndex((s) => s.code === d.orig)] = rec; else cfg.shifts.push(rec);
    ui.shiftDraft = null; Store.touchCfg(); logEv('ذخیرهٔ شیفت ' + rec.code); render();
  }
});

/* ---------- تغییر فیلدها ---------- */
document.addEventListener('change', async (e) => {
  const t = e.target, cfg = DB.cfg;
  if (t.id === 'f-dept') { ui.dept = t.value; return render(); }
  if (t.id === 'pcal-person') { ui.pcalPerson = t.value; return refreshPcal(); }
  if (t.dataset.dcolor) { const d = dept(t.dataset.dcolor); if (d) { d.color = t.value; Store.touchCfg(); } return; }
  if (t.dataset.dname) { const d = dept(t.dataset.dname); if (d && t.value.trim()) { d.name = t.value.trim(); Store.touchCfg(); } return; }
  if (t.dataset.set) {
    const S = cfg.settings, k = t.dataset.set;
    if (k === 'fridayHoliday') S.fridayHoliday = t.checked;
    else if (k === 'dutyMin') { const v = toMin(t.value); if (v > 0 && v <= 1440) S.dutyMin = v; }
    else if (k.startsWith('f:')) S.factors[k.slice(2)] = Math.max(1, parseFloat(toLatin(t.value)) || 1);
    else S[k] = Math.max(0, parseFloat(toLatin(t.value)) || 0);
    Store.touchCfg(); logEv('تغییر تنظیمات: ' + k);
    if (ui.tab === 'hol') render();
    return;
  }
  if (t.dataset.sd) {
    const d = ui.shiftDraft; d[t.dataset.sd] = t.value;
    if (t.dataset.sd === 'kind') { if (d.kind === 'combo' && !d.refs.length) { const first = cfg.shifts.find((s) => s.kind !== 'combo' && s.code !== d.orig); d.refs.push({ code: first ? first.code : '', o: 0 }); } if (d.kind === 'simple' && !d.segs.length) d.segs.push({ o: 0, s: '08:00', e: '14:00' }); return render(); }
    return shiftDraftPreview();
  }
  if (t.dataset.sg) { const [i, k] = t.dataset.sg.split(':'); ui.shiftDraft.segs[+i][k] = k === 'o' ? +t.value : t.value; return shiftDraftPreview(); }
  if (t.dataset.rf) { const [i, k] = t.dataset.rf.split(':'); ui.shiftDraft.refs[+i][k] = k === 'o' ? +t.value : t.value; return shiftDraftPreview(); }
  if (t.id === 'restore-file' && t.files && t.files[0]) {
    try {
      const o = JSON.parse(await t.files[0].text());
      if (!o || o.app !== 'shiftyar' || !o.cfg) throw new Error('فایل پشتیبان شیفت‌یار نیست.');
      await Store.replaceAll(normalizeCfg(o.cfg), o.assign || {}, o.log || []);
      ui.undo = []; ui.editPerson = null; await render(); flash('اطلاعات بازیابی شد.', true);
    } catch (err) { flash('بازیابی نشد: ' + err.message, false, '#set-msg'); }
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.sd === 'code' || t.dataset.sd === 'name') { ui.shiftDraft[t.dataset.sd] = t.value; }
});

/* ---------- فرم‌های ورود، گذرواژه و کاربران (حالت سرور) ---------- */
document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (!['f-login', 'f-pw', 'f-user'].includes(f.id)) return;
  e.preventDefault();
  const fd = new FormData(f);
  const btn = f.querySelector('button[type=submit]');
  if (btn) btn.disabled = true;
  try {
    if (f.id === 'f-login') {
      try {
        const r = await Store.api('POST', '/api/login', { code: toLatin(String(fd.get('code') || '').trim()), password: String(fd.get('password') || '') });
        ME.user = r.user; loginMsg = '';
        if (!ME.user.mustChange) await Store.enterApp();
        ui.tab = tabsFor()[0][0];
      } catch (err) { ME.user = null; loginMsg = err.message; }
      await render();
    } else if (f.id === 'f-pw') {
      const force = f.dataset.force === '1';
      const cur = String(fd.get('current') || ''), nx = String(fd.get('next') || ''), again = String(fd.get('again') || '');
      const fail = async (m) => { if (force) { loginMsg = m; await render(); } else flash(m, false, '#f-pw-msg'); };
      if (nx !== again) return fail('تکرار گذرواژه با گذرواژهٔ جدید یکی نیست.');
      try {
        await Store.api('POST', '/api/password', { current: cur, next: nx });
        if (force) { ME.user.mustChange = false; await Store.enterApp(); ui.tab = tabsFor()[0][0]; loginMsg = ''; await render(); flash('گذرواژهٔ جدید ذخیره شد.', true); }
        else { f.reset(); flash('گذرواژه تغییر کرد.', true, '#f-pw-msg'); }
      } catch (err) { await fail(err.message); }
    } else if (f.id === 'f-user') {
      const role_ = fd.get('role');
      const body = {
        code: String(fd.get('code') || '').trim(), role: role_, personId: fd.get('personId') || null,
        deptIds: role_ === 'manager' ? fd.getAll('dept') : [],
      };
      const editing = usersState.edit;
      if (!editing && fd.get('password')) body.password = String(fd.get('password'));
      try {
        if (editing) { await Store.api('PATCH', '/api/users/' + editing.id, body); usersState.edit = null; }
        else {
          const r = await Store.api('POST', '/api/users', body);
          usersState.notice = r.tempPassword
            ? `گذرواژهٔ موقت <b>${esc(r.user.code)}</b>: <span class="num">${esc(r.tempPassword)}</span> — فقط همین یک بار نمایش داده می‌شود.`
            : `حساب <b>${esc(r.user.code)}</b> ساخته شد.`;
        }
        await render();
      } catch (err) { flash(err.message, false, '#f-user-msg'); }
    }
  } finally {
    const again = f.isConnected ? f.querySelector('button[type=submit]') : null;
    if (again) again.disabled = false;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'u-role') { const fs = $('#u-depts'); if (fs) fs.style.display = e.target.value === 'manager' ? '' : 'none'; }
});

/* ---------- شروع ---------- */
(async function start() {
  const d = d2j(todayJdn()); ui.jy = d.jy; ui.jm = d.jm;
  await render();
  await Store.init();
  await render();
})();

</script>
